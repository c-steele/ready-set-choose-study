<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Find the Caregiver — private slide navigator</title>
  <link rel="stylesheet" href="presenter.css?v=zoom-direct-navigator-2026-10-27">
</head>
<body>
  <header class="presenter-header">
    <h1>Find the Caregiver</h1>
    <p class="privacy-note">Researcher view · Share only the <strong>study window</strong></p>
    <span class="connection" data-connection role="status">Connecting…</span>
  </header>
  <main class="presenter-main">
    <aside class="slide-list-panel" aria-label="All slides">
      <h2>Slides <span data-slide-total></span></h2>
      <div class="slide-list" data-slide-list></div>
    </aside>
    <section class="viewer-panel">
      <p class="empty-state" data-empty>Keep the study window open. Its slides will appear here when connected.</p>
      <div class="viewer-grid" data-viewers hidden>
        <section class="slide-card live-card">
          <div class="slide-card-heading"><h2>Current</h2><span class="slide-counter" data-live-counter></span></div>
          <p class="slide-title" data-live-title></p>
          <div class="slide-viewport" data-viewport><iframe title="Current participant slide, read-only" data-live-frame sandbox="" tabindex="-1"></iframe></div>
        </section>
        <section class="slide-card preview-card">
          <div class="slide-card-heading"><h2 data-preview-heading>Next</h2><span class="slide-counter" data-preview-counter></span></div>
          <p class="slide-title" data-preview-title></p>
          <div class="slide-viewport" data-viewport><iframe title="Selected slide, private read-only preview" data-preview-frame sandbox="" tabindex="-1"></iframe></div>
          <div class="preview-controls"><button type="button" data-preview-previous aria-label="Preview previous slide">←</button><button type="button" data-preview-next aria-label="Preview next slide">→</button></div>
        </section>
      </div>
      <div class="action-row" data-actions hidden>
        <button class="secondary-button" type="button" data-follow title="Automatically preview the next slide as the participant advances">Follow live</button>
        <p>Click a thumbnail to show it. The preview arrows only look ahead.</p>
      </div>
      <p class="navigation-status" data-navigation-status role="status"></p>
      <details class="script-panel" data-script-panel hidden><summary>Read-aloud text for preview</summary><div data-preview-script></div></details>
    </section>
  </main>
  <footer class="story-footer"><span>Go to story</span><nav data-story-buttons aria-label="Story shortcuts"></nav></footer>
  <script src="presenter.js?v=zoom-slides-button-2026-10-27"></script>
</body>
</html>
